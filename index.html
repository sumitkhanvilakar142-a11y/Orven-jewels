<!-- Login Form -->
      <div id="loginFormWrapper">
        <div style="font-size:20px; color:#fff; font-weight:600; margin-bottom: 5px;">Secure Mobile Login</div>
        <p style="margin-bottom: 20px; font-size: 13px; color: #aaa;">Enter your mobile number to sign in. Admins will route automatically.</p>
        
        <form onsubmit="handleAuthorizedLogin(event)">
          <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-size: 12px; color: #aaa;">Mobile Number</label>
            <div style="display: flex; gap: 8px;">
              <select id="authCountryCode" style="padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px;">
                <option value="+91" selected>IN (+91)</option>
                <option value="+1">USA/CA (+1)</option>
                <option value="+44">UK (+44)</option>
                <option value="+971">UAE (+971)</option>
                <option value="+61">AUS (+61)</option>
                <option value="+81">JPN (+81)</option>
                <option value="+49">GER (+49)</option>
                <option value="+33">FRA (+33)</option>
                <option value="+966">KSA (+966)</option>
              </select>
              <input type="text" id="authMobile" required placeholder="8401715116" value="8401715116" style="width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px;">
            </div>
          </div>
          <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-size: 12px; color: #aaa;">Security PIN / Password</label>
            <input type="password" id="authPassword" required placeholder="Enter PIN" style="width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px;">
          </div>
          <button type="submit" style="width: 100%; padding: 12px; background: var(--gold, #d4af37); color: #000; font-weight:600; border: none; cursor: pointer; border-radius: 4px;">Login</button>
        </form>
      </div>

      <!-- Signup Form -->
      <div id="signupFormWrapper" style="display: none;">
        <div style="font-size:20px; color:#fff; font-weight:600; margin-bottom: 5px;">Create New Account</div>
        <p style="margin-bottom: 20px; font-size: 13px; color: #aaa;">Register your details to join ORVÉN JEWELS.</p>
        
        <form onsubmit="handleCustomerSignup(event)">
          <div style="margin-bottom: 12px;">
            <label style="display: block; margin-bottom: 5px; font-size: 12px; color: #aaa;">Full Name</label>
            <input type="text" id="signupName" required placeholder="Enter your name" style="width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px;">
          </div>
          <div style="margin-bottom: 12px;">
            <label style="display: block; margin-bottom: 5px; font-size: 12px; color: #aaa;">Mobile Number</label>
            <div style="display: flex; gap: 8px;">
              <select id="signupCountryCode" style="padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px;">
                <option value="+91" selected>IN (+91)</option>
                <option value="+1">USA/CA (+1)</option>
                <option value="+44">UK (+44)</option>
                <option value="+971">UAE (+971)</option>
                <option value="+61">AUS (+61)</option>
                <option value="+81">JPN (+81)</option>
                <option value="+49">GER (+49)</option>
                <option value="+33">FRA (+33)</option>
                <option value="+966">KSA (+966)</option>
              </select>
              <input type="text" id="signupMobile" required placeholder="Mobile Number" style="width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px;">
            </div>
          </div>
          <div style="margin-bottom: 12px;">
            <label style="display: block; margin-bottom: 5px; font-size: 12px; color: #aaa;">Create Security PIN</label>
            <input type="password" id="signupPassword" required placeholder="Set a PIN" style="width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px;">
          </div>
          <button type="submit" style="width: 100%; padding: 12px; background: var(--gold, #d4af37); color: #000; font-weight:600; border: none; cursor: pointer; border-radius: 4px;">Sign Up</button>
        </form>
      </div>
