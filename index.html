<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Real Ring Customizer</title>
  <style>
    body { margin: 0; background: #0b0b0b; color: #fff; font-family: sans-serif; display: flex; height: 100vh; }
    #canvas-container { flex: 1; height: 100%; }
    .ui-panel { width: 320px; background: #121212; padding: 20px; box-sizing: border-box; border-left: 1px solid #2a2a2a; }
    .btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; margin: 5px 0; width: 100%; cursor: pointer; }
    .btn:hover { border-color: #c5a059; }
  </style>
  <!-- Three.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-panel">
    <h3>Metal Type</h3>
    <button class="btn" onclick="changeMetal('#ffd700', 0.9, 0.1)">Yellow Gold</button>
    <button class="btn" onclick="changeMetal('#e5e4e2', 0.95, 0.05)">Platinum</button>
    <button class="btn" onclick="changeMetal('#b76e79', 0.85, 0.15)">Rose Gold</button>

    <h3>Diamond Color</h3>
    <button class="btn" onclick="changeDiamond('#ffffff')">D-F Clear</button>
    <button class="btn" onclick="changeDiamond('#ffb6c1')">Pink Diamond</button>
    <button class="btn" onclick="changeDiamond('#000000')">Black Diamond</button>
  </div>

  <script>
    // 1. Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 2. Lighting (Luxury Jewellery Lighting)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 2);
    mainLight.position.set(5, 10, 7);
    scene.add(mainLight);

    const pointLight = new THREE.PointLight(0xffffff, 1.5);
    pointLight.position.set(-5, -2, -5);
    scene.add(pointLight);

    // 3. 3D Ring Band Geometry & Material
    const ringGeo = new THREE.TorusGeometry(2, 0.25, 30, 100);
    const metalMat = new THREE.MeshStandardMaterial({
      color: 0xffd700,
      metalness: 0.95,
      roughness: 0.1
    });
    const ringMesh = new THREE.Mesh(ringGeo, metalMat);
    ringMesh.rotation.x = Math.PI / 3;
    scene.add(ringMesh);

    // 4. Gemstone (Diamond) Geometry & Material
    const gemGeo = new THREE.OctahedronGeometry(0.5, 2);
    const gemMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 0.9,  // Refraction / Glass effect
      opacity: 1,
      transparent: true,
      roughness: 0,
      ior: 2.4,            // Diamond Index of Refraction
      reflectivity: 0.9
    });
    const gemMesh = new THREE.Mesh(gemGeo, gemMat);
    gemMesh.position.set(0, 2.1, 0.7);
    scene.add(gemMesh);

    // 5. Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      ringMesh.rotation.z += 0.005; // Smooth 360-rotation
      gemMesh.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();

    // Customizer Controls
    function changeMetal(colorHex, metalness, roughness) {
      metalMat.color.setHex(colorHex.replace('#', '0x'));
      metalMat.metalness = metalness;
      metalMat.roughness = roughness;
    }

    function changeDiamond(colorHex) {
      gemMat.color.setHex(colorHex.replace('#', '0x'));
    }
  </script>
</body>
</html>
