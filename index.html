<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORVÉN JEWELS | Fine Jewellery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Playfair Display', Georgia, serif; }
        body { background-color: #0f0f0f; color: #f5f5f5; text-align: center; }
        header { padding: 40px 20px; background: linear-gradient(180deg, #000000, #181818); border-bottom: 1px solid #d4af37; }
        h1 { font-size: 2.5rem; letter-spacing: 4px; color: #d4af37; text-transform: uppercase; }
        p.subtitle { font-size: 0.9rem; color: #aaa; letter-spacing: 2px; margin-top: 5px; }
        .gallery-container { padding: 30px 15px; max-width: 1200px; margin: auto; }
        .category-title { font-size: 1.8rem; color: #d4af37; margin: 40px 0 20px 0; border-bottom: 1px solid #333; padding-bottom: 10px; text-align: left; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { background: #1a1a1a; border-radius: 8px; border: 1px solid #2a2a2a; overflow: hidden; padding: 10px; transition: 0.3s; }
        .card:hover { border-color: #d4af37; transform: translateY(-3px); }
        .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 5px; }
        .card-title { color: #ccc; margin-top: 10px; font-size: 0.85rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header>
        <h1>ORVÉN JEWELS</h1>
        <p class="subtitle">PREMIUM JEWELLERY • CUSTOM DESIGNS</p>
    </header>

    <div class="gallery-container">
        
        <!-- Necklaces -->
        <h2 class="category-title">Necklaces</h2>
        <div class="grid">
            <div class="card"><img src="./necklaces/IMG-20260812-WA0013.jpg"><p class="card-title">Necklace Design</p></div>
            <div class="card"><img src="./necklaces/IMG-20260812-WA0024.jpg"><p class="card-title">Necklace Design</p></div>
            <div class="card"><img src="./necklaces/IMG-20260812-WA0025.jpg"><p class="card-title">Necklace Design</p></div>
            <div class="card"><img src="./necklaces/IMG-20260812-WA0026.jpg"><p class="card-title">Necklace Design</p></div>
        </div>

        <!-- Cocktail Rings -->
        <h2 class="category-title">Cocktail Rings</h2>
        <div class="grid">
            <div class="card"><img src="./Cocktail-Ring/PHOTO_NAME.jpg"><p class="card-title">Cocktail Ring</p></div>
        </div>

        <!-- Solitaire Diamond Rings -->
        <h2 class="category-title">Solitaire Diamond Rings</h2>
        <div class="grid">
            <div class="card"><img src="./solitaire-diamond-ring/PHOTO_NAME.jpg"><p class="card-title">Solitaire Ring</p></div>
        </div>

        <!-- Bracelets -->
        <h2 class="category-title">Bracelets</h2>
        <div class="grid">
            <div class="card"><img src="./bracelet/PHOTO_NAME.jpg"><p class="card-title">Bracelet</p></div>
            <div class="card"><img src="./tennis-bracelet/PHOTO_NAME.jpg"><p class="card-title">Tennis Bracelet</p></div>
        </div>

        <!-- Mangalsutra -->
        <h2 class="category-title">Mangalsutra</h2>
        <div class="grid">
            <div class="card"><img src="./mangalsutra/PHOTO_NAME.jpg"><p class="card-title">Mangalsutra</p></div>
        </div>

        <!-- Nosepin -->
        <h2 class="category-title">Nosepin</h2>
        <div class="grid">
            <div class="card"><img src="./nosepin/PHOTO_NAME.jpg"><p class="card-title">Nosepin</p></div>
        </div>

    </div>

</body>
</html>
