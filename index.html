<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Jewelry Configurator - ORVÉN JEWELS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0b0b; color: #f5f5f5; font-family: 'Montserrat', sans-serif; padding: 40px 20px; }
    
    .customizer-container {
      max-width: 1200px; margin: 0 auto; background: #121212;
      border: 1px solid #2a2a2a; border-radius: 4px;
      display: flex; flex-wrap: wrap; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    /* Left Side: Preview Area */
    .preview-panel {
      flex: 1.2; min-width: 320px; background: radial-gradient(circle, #1a1a1a 0%, #080808 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px; border-right: 1px solid #2a2a2a; position: relative;
    }

    .brand-tag {
      position: absolute; top: 20px; left: 25px;
      font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 2px; color: #c5a059;
    }

    .ring-stage {
      width: 220px; height: 220px; border-radius: 50%;
      border: 20px solid #d4af37; position: relative;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: all 0.4s ease;
    }

    .gemstone {
      width: 45px; height: 45px; background: #000;
      position: absolute; top: -32px; transform: rotate(45deg);
      border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 15px rgba(0,0,0,0.8); transition: all 0.4s ease;
    }

    .engraving-text {
      position: absolute; bottom: 20px; font-size: 11px;
      color: rgba(255,255,255,0.7); font-family: 'Cinzel', serif;
      letter-spacing: 2px; text-transform: uppercase;
    }

    /* Right Side: Control Options */
    .control-panel { flex: 1; min-width: 320px; padding: 40px 30px; }
    
    .title { font-family: 'Cinzel', serif; font-size: 24px; letter-spacing: 2px; margin-bottom: 8px; color: #fff; }
    .subtitle { font-size: 12px; color: #888; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }

    .option-group { margin-bottom: 25px; }
    .label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; color: #c5a059; margin-bottom: 12px; display: block; }

    .btn-grid { display: flex; gap: 10px; flex-wrap: wrap; }
    
    .opt-btn {
      background: transparent; border: 1px solid #333; color: #ccc;
      padding: 10px 18px; font-size: 12px; font-family: 'Montserrat', sans-serif;
      cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
    }
    .opt-btn:hover, .opt-btn.active { border-color: #c5a059; color: #fff; background: rgba(197, 160, 89, 0.1); }

    input[type="text"], select {
      width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff;
      padding: 12px; font-size: 13px; font-family: 'Montserrat', sans-serif; outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: #c5a059; }

    .cta-btn {
      width: 100%; background: #c5a059; color: #000; border: none;
      padding: 15px; font-family: 'Cinzel', serif; font-weight: 600;
      letter-spacing: 2px; cursor: pointer; margin-top: 20px; transition: 0.3s;
    }
    .cta-btn:hover { background: #e5be75; }
  </style>
</head>
<body>

  <div class="customizer-container">
    <!-- Left: Luxury Live Preview -->
    <div class="preview-panel">
      <span class="brand-tag">ORVÉN JEWELS • CUSTOM STUDIO</span>
      <div class="ring-stage" id="ringBand">
        <div class="gemstone" id="ringStone"></div>
        <span class="engraving-text" id="engravingDisplay"></span>
      </div>
    </div>

    <!-- Right: Customization Controls -->
    <div class="control-panel">
      <h1 class="title">DESIGN YOUR RING</h1>
      <p class="subtitle">Personalized Perfection</p>

      <!-- 1. Metal Selection -->
      <div class="option-group">
        <span class="label">1. Select Metal</span>
        <div class="btn-grid">
          <button class="opt-btn active" onclick="setMetal('#d4af37', this)">Yellow Gold</button>
          <button class="opt-btn" onclick="setMetal('#e5e4e2', this)">Platinum</button>
          <button class="opt-btn" onclick="setMetal('#b76e79', this)">Rose Gold</button>
        </div>
      </div>

      <!-- 2. Gemstone Selection -->
      <div class="option-group">
        <span class="label">2. Gemstone Choice</span>
        <div class="btn-grid">
          <button class="opt-btn active" onclick="setStone('#000000', '45deg', this)">Onyx</button>
          <button class="opt-btn" onclick="setStone('#b9f2ff', '0deg', this)">Diamond</button>
          <button class="opt-btn" onclick="setStone('#e0115f', '45deg', this)">Ruby</button>
          <button class="opt-btn" onclick="setStone('#0f52ba', '0deg', this)">Sapphire</button>
        </div>
      </div>

      <!-- 3. Band Style -->
      <div class="option-group">
        <span class="label">3. Band Thickness</span>
        <div class="btn-grid">
          <button class="opt-btn active" onclick="setBand('20px', this)">Classic</button>
          <button class="opt-btn" onclick="setBand('28px', this)">Bold Statement</button>
        </div>
      </div>

      <!-- 4. Inside Engraving -->
      <div class="option-group">
        <span class="label">4. Inside Engraving</span>
        <input type="text" id="engravingInput" placeholder="ENTER NAME OR INITIALS" maxlength="10" oninput="updateEngraving()">
      </div>

      <!-- 5. Ring Size -->
      <div class="option-group">
        <span class="label">5. Select Size</span>
        <select>
          <option>US 6 - 16.5 mm</option>
          <option selected>US 7 - 17.3 mm</option>
          <option>US 8 - 18.2 mm</option>
          <option>US 9 - 18.9 mm</option>
        </select>
      </div>

      <button class="cta-btn">REQUEST THIS CUSTOM DESIGN</button>
    </div>
  </div>

  <script>
    function setMetal(color, btn) {
      document.getElementById('ringBand').style.borderColor = color;
      setActive(btn);
    }

    function setStone(color, rotation, btn) {
      const stone = document.getElementById('ringStone');
      stone.style.backgroundColor = color;
      stone.style.transform = `rotate(${rotation})`;
      setActive(btn);
    }

    function setBand(width, btn) {
      document.getElementById('ringBand').style.borderWidth = width;
      setActive(btn);
    }

    function updateEngraving() {
      const val = document.getElementById('engravingInput').value;
      document.getElementById('engravingDisplay').innerText = val;
    }

    function setActive(element) {
      const parent = element.parentElement;
      parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
