<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewellery Price Calculator - ORVÉN JEWELS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .calc-container { max-width: 600px; margin: 40px auto; padding: 30px; background: var(--card-bg, #140d0f); border: 1px solid var(--border, #241a1c); border-radius: 8px; }
    .calc-container h1 { font-family: 'Cinzel', serif; font-size: 22px; color: #fff; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-muted, #a09a9c); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; background: #1a1214; border: 1px solid var(--border, #241a1c); padding: 12px; color: #fff; font-size: 13px; border-radius: 4px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--gold, #d4af37); }
    .btn-calc { width: 100%; background: var(--gold, #d4af37); color: #000; border: none; padding: 12px; font-weight: 600; font-size: 12px; letter-spacing: 1.5px; cursor: pointer; border-radius: 4px; margin-top: 10px; text-transform: uppercase; }
    .result-box { margin-top: 25px; padding: 20px; background: #1a1214; border: 1px solid var(--gold, #d4af37); border-radius: 4px; text-align: center; }
    .result-box h3 { font-family: 'Cinzel', serif; color: var(--gold, #d4af37); font-size: 18px; margin-bottom: 5px; }
    .result-box p { font-size: 18px; color: #fff; font-weight: 600; }
  </style>
</head>
<body style="background-color: var(--bg-dark, #0b0708); color: var(--text-main, #f5f5f5); font-family: 'Montserrat', sans-serif;">

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(11,7,8,0.9); border-bottom: 1px solid var(--border, #241a1c);">
    <a href="index.html" class="brand-logo" style="font-family: 'Cinzel', serif; font-size: 20px; color: #fff; text-decoration: none;">ORVÉN <span>JEWELS</span></a>
    <a href="index.html" style="color: var(--gold, #d4af37); font-size: 11px; text-decoration: none; letter-spacing: 1px;">← BACK TO HOME</a>
  </header>

  <div class="calc-container">
    <h1>Live Jewellery Price Estimator</h1>
    <form onsubmit="calculatePrice(event)">
      <div class="form-group">
        <label>Select Metal Purity</label>
        <select id="metalPurity">
          <option value="15824">24K Gold (₹15,824 /g)</option>
          <option value="11868">18K Gold (₹11,868 /g)</option>
          <option value="9232">14K Gold (₹9,232 /g)</option>
          <option value="5900">9K Gold (₹5,900 /g)</option>
          <option value="255">925 Silver (₹255 /g)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Weight (in grams)</label>
        <input type="number" id="metalWeight" step="0.01" required placeholder="e.g., 10">
      </div>

      <div class="form-group">
        <label>Making Charges & Stones (Approx ₹)</label>
        <input type="number" id="makingCharges" value="1500" required>
      </div>

      <button type="submit" class="btn-calc">Calculate Total Price</button>
    </form>

    <div class="result-box" id="resultSection" style="display:none;">
      <h3>Estimated Total Amount</h3>
      <p id="totalAmount">₹0.00</p>
    </div>
  </div>

  <script>
    function calculatePrice(event) {
      event.preventDefault();
      const ratePerGram = parseFloat(document.getElementById('metalPurity').value);
      const weight = parseFloat(document.getElementById('metalWeight').value);
      const making = parseFloat(document.getElementById('makingCharges').value);

      const metalCost = ratePerGram * weight;
      const total = metalCost + making;

      document.getElementById('totalAmount').innerText = `₹ ${total.toLocaleString('en-IN', {maximumFractionDigits: 2})}`;
      document.getElementById('resultSection').style.display = 'block';
    }
  </script>

</body>
</html>
