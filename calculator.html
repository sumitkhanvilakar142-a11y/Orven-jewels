<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewellery Calculator - Orvén Jewels</title>
  <style>
    body { font-family: sans-serif; background: #0b0708; color: #fff; padding: 20px; }
    .card { background: #140d0f; padding: 20px; border-radius: 8px; border: 1px solid #241a1c; max-width: 500px; margin: auto; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; background: #1c1315; border: 1px solid #3a2924; color: #fff; box-sizing: border-box; }
    button { background: #d4af37; color: #000; font-weight: bold; padding: 12px; border: none; width: 100%; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Price Calculator</h2>
    <label>Gold Weight (grams):</label>
    <input type="number" placeholder="0.00">
    <label>Purity:</label>
    <select>
      <option>18KT (76.0%)</option>
      <option>22KT (91.6%)</option>
    </select>
    <button>Calculate Total</button>
  </div>
</body>
</html>
