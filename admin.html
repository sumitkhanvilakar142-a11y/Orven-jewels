<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORVÉN JEWELS - Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0708;
      --card-bg: #140d0f;
      --gold: #d4af37;
      --text: #ffffff;
      --text-muted: #a09a9c;
      --border: #241a1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 25px; }
    .brand-logo { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold); font-weight: 700; text-decoration: none; }
    
    .admin-container { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
    @media(max-width: 900px) { .admin-container { grid-template-columns: 1fr; } }

    .admin-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .admin-card h3 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 15px; font-size: 18px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; background: #1a1214; border: 1px solid var(--border); padding: 10px; color: var(--text); border-radius: 4px; font-size: 12px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--gold); }
    
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .checkbox-group input { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; }

    .btn-action { width: 100%; background: var(--gold); color: #000; border: none; padding: 12px; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; cursor: pointer; border-radius: 4px; text-transform: uppercase; transition: opacity 0.3s; }
    .btn-action:hover { opacity: 0.9; }

    /* Product List Table Style */
    .product-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .product-table th, .product-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }
    .product-table th { color: var(--gold); font-family: 'Cinzel', serif; }
    .action-btns { display: flex; gap: 8px; }
    .btn-edit { background: #3a2a2e; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 10px; }
    .btn-delete { background: #5c1d1d; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 10px; }
    .btn-edit:hover { background: var(--gold); color: #000; }
    .btn-delete:hover { background: #ff4d4d; }
  </style>
</head>
<body>

  <div class="admin-header">
    <a href="index.html" class="brand-logo">ORVÉN <span>ADMIN PORTAL</span></a>
    <a href="index.html" style="color: var(--text-muted); font-size: 12px; text-decoration: none;">← Back to Website</a>
  </div>

  <div class="admin-container">
    <!-- Left Side: Upload / Edit Form -->
    <div class="admin-card">
      <h3 id="formTitle">Upload New Jewellery</h3>
      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="editIndex" value="">
        
        <div class="form-group">
          <label>Item Name / Title</label>
          <input type="text" id="prodName" required placeholder="e.g. Panther Diamond Ring">
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="prodCategory" required>
            <option value="Cocktail-Ring">Cocktail Rings</option>
            <option value="Diamond-Studs-for-Girls">Diamond Studs</option>
            <option value="necklaces">Necklaces</option>
            <option value="rings">Rings</option>
            <option value="bracelet">Bracelets</option>
            <option value="mangalsutra">Mangalsutra</option>
            <option value="tennis-bracelet">Tennis Bracelets</option>
          </select>
        </div>

        <div class="form-group">
          <label>Image URL or File Name</label>
          <input type="text" id="prodImage" required placeholder="e.g. IMG-20260812-WA0196.jpg">
        </div>

        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="prodPrice" required placeholder="45000">
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="showOnHome">
          <label for="showOnHome" style="margin-bottom:0; cursor:pointer;">Show this product on Homepage Vaults</label>
        </div>

        <button type="submit" class="btn-action" style="margin-top: 20px;" id="submitBtn">Publish Product</button>
      </form>
    </div>

    <!-- Right Side: Manage Existing Products -->
    <div class="admin-card">
      <h3>Manage Inventory & Categories</h3>
      <div style="overflow-x: auto;">
        <table class="product-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Home View</th>
              <th>Actions</th>
            </tr>
          Ref</thead>
          <tbody id="inventoryList">
            <!-- Dynamically populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Load products on start
    document.addEventListener("DOMContentLoaded", renderInventory);

    function saveProduct(event) {
      event.preventDefault();
      
      const editIndex = document.getElementById('editIndex').value;
      const name = document.getElementById('prodName').value.trim();
      const category = document.getElementById('prodCategory').value;
      const image = document.getElementById('prodImage').value.trim();
      const price = document.getElementById('prodPrice').value.trim();
      const showOnHome = document.getElementById('showOnHome').checked;

      let products = JSON.parse(localStorage.getItem('orven_products')) || [];

      const productData = { name, category, image, price, showOnHome };

      if (editIndex === "") {
        products.push(productData);
        alert("Product added successfully!");
      } else {
        products[editIndex] = productData;
        alert("Product updated successfully!");
        document.getElementById('editIndex').value = "";
        document.getElementById('formTitle').innerText = "Upload New Jewellery";
        document.getElementById('submitBtn').innerText = "Publish Product";
      }

      localStorage.setItem('orven_products', JSON.stringify(products));
      document.getElementById('productForm').reset();
      renderInventory();
    }

    function renderInventory() {
      const inventoryList = document.getElementById('inventoryList');
      let products = JSON.parse(localStorage.getItem('orven_products')) || [];
      
      if (products.length === 0) {
        inventoryList.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">No products uploaded yet.</td></tr>`;
        return;
      }

      inventoryList.innerHTML = "";
      products.forEach((prod, index) => {
        inventoryList.innerHTML += `
          <tr>
            <td><img src="${prod.image}" width="35" height="35" style="object-fit:cover; border-radius:3px;" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=500'"></td>
            <td><b>${prod.name}</b><br><small style="color:var(--text-muted)">₹${prod.price}</small></td>
            <td>${prod.category}</td>
            <td>${prod.showOnHome ? '⭐ Yes' : 'No'}</td>
            <td>
              <div class="action-btns">
                <button class="btn-edit" onclick="editProduct(${index})">Edit</button>
                <button class="btn-delete" onclick="deleteProduct(${index})">Remove</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    function editProduct(index) {
      let products = JSON.parse(localStorage.getItem('orven_products')) || [];
      let prod = products[index];

      document.getElementById('editIndex').value = index;
      document.getElementById('prodName').value = prod.name;
      document.getElementById('prodCategory').value = prod.category;
      document.getElementById('prodImage').value = prod.image;
      document.getElementById('prodPrice').value = prod.price;
      document.getElementById('showOnHome').checked = prod.showOnHome;

      document.getElementById('formTitle').innerText = "Edit Jewellery Item";
      document.getElementById('submitBtn').innerText = "Update Product";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProduct(index) {
      if (confirm("Are you sure you want to remove this product?")) {
        let products = JSON.parse(localStorage.getItem('orven_products')) || [];
        products.splice(index, 1);
        localStorage.setItem('orven_products', JSON.stringify(products));
        renderInventory();
      }
    }
  </script>
</body>
</html>
