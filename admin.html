<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orven Jewels — Owner Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0708; --card-bg: #140d0f; --gold: #d4af37; --text: #ffffff; --text-muted: #a09a9c; --border: #2c2022; --input-bg: #1a1214; --danger: #8b0000; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
    .topbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-family: 'Cinzel', serif; color: var(--gold); font-size: 14px; font-weight: 700; }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    .section-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .section-title { font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold); margin-bottom: 4px; }
    .section-desc { font-size: 10px; color: var(--text-muted); margin-bottom: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; background: var(--input-bg); border: 1px solid var(--border); padding: 8px; color: var(--text); border-radius: 5px; font-size: 11px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--gold); }
    .file-box { border: 1px dashed var(--border); padding: 10px; border-radius: 5px; background: var(--input-bg); font-size: 10px; text-align: center; }
    .slot-card { background: #1c1316; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; position: relative; }
    .slot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; color: var(--gold); font-weight: 600; }
    .btn-remove-slot { background: var(--danger); color: #fff; border: none; width: 18px; height: 18px; border-radius: 4px; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-secondary { background: transparent; border: 1px dashed var(--gold); color: var(--gold); padding: 8px; border-radius: 5px; font-size: 11px; cursor: pointer; width: 100%; text-align: center; }
    .btn-save { background: var(--gold); color: #000; border: none; padding: 12px; width: 100%; font-weight: 700; font-size: 11px; border-radius: 5px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">Orven Jewels · Owner Portal</div>
    <div style="font-size: 11px; color: var(--text-muted);">
      <a href="index.html" style="color: var(--gold); text-decoration: none; margin-right: 15px;">Vault</a>
      <span style="color: var(--gold);">owner (staff)</span>
    </div>
  </div>

  <div class="container">
    <div style="font-family:'Cinzel', serif; font-size: 13px; color: var(--gold); margin-bottom: 12px;">RINGS — Edit / Add Design</div>

    <form onsubmit="saveItem(event)">
      <div class="section-box">
        <div class="form-group">
          <label>Design Number (SKU)</label>
          <input type="text" id="sku" value="ORV 249" required>
        </div>
        <div class="form-group">
          <label>Gold Weight (g)</label>
          <input type="number" step="0.001" id="goldWeight" value="4.5">
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">Fancy stone slots — priced by category rate</div>
        <div class="section-desc">Select type, pieces, and cent size.</div>
        
        <div id="fancySlotsContainer">
          <div class="slot-card" id="fancy-slot-1">
            <div class="slot-header"><span>Fancy 1</span> <button type="button" class="btn-remove-slot" onclick="removeSlot('fancy-slot-1')">✕</button></div>
            <div class="form-group">
              <label>Type</label>
              <select class="fancy-type">
                <option value="- none -">- none -</option>
                <option value="Fancy Shape">Fancy Shape</option>
                <option value="Fancy Color">Fancy Color</option>
                <option value="Moissanite">Moissanite</option>
                <option value="Gem Stone" selected>Gem Stone</option>
              </select>
            </div>
            <div class="form-group"><label>Pieces</label><input type="number" class="fancy-pcs" value="1.0"></div>
            <div class="form-group" style="margin-bottom:0;"><label>Cent (carat size)</label><input type="number" class="fancy-cent" value="209.0"></div>
          </div>
        </div>
        <button type="button" class="btn-secondary" onclick="addFancySlot()">+ Add fancy stone</button>
      </div>

      <div class="section-box">
        <div class="section-title">CAD Reference Files</div>
        <div class="section-desc">.3dm / .stl / .jpg / .png reference files. Owner/staff only.</div>
        <div class="file-box">
          <input type="file" id="cadRefFile" accept=".3dm,.stl,.jpg,.png,image/jpeg,image/png" style="font-size:10px;">
        </div>
      </div>

      <button type="submit" class="btn-save">Save & Recalculate Prices</button>
    </form>
  </div>

  <script>
    let fancyCount = 1;

    function addFancySlot() {
      fancyCount++;
      const container = document.getElementById('fancySlotsContainer');
      const div = document.createElement('div');
      div.className = 'slot-card';
      div.id = `fancy-slot-${fancyCount}`;
      div.innerHTML = `
        <div class="slot-header"><span>Fancy ${fancyCount}</span> <button type="button" class="btn-remove-slot" onclick="removeSlot('fancy-slot-${fancyCount}')">✕</button></div>
        <div class="form-group">
          <label>Type</label>
          <select class="fancy-type">
            <option value="- none -" selected>- none -</option>
            <option value="Fancy Shape">Fancy Shape</option>
            <option value="Fancy Color">Fancy Color</option>
            <option value="Moissanite">Moissanite</option>
            <option value="Gem Stone">Gem Stone</option>
          </select>
        </div>
        <div class="form-group"><label>Pieces</label><input type="number" class="fancy-pcs" value="0"></div>
        <div class="form-group" style="margin-bottom:0;"><label>Cent (carat size)</label><input type="number" class="fancy-cent" value="0"></div>
      `;
      container.appendChild(div);
    }

    function removeSlot(id) {
      document.getElementById(id).remove();
    }

    function saveItem(e) {
      e.preventDefault();
      const sku = document.getElementById('sku').value;
      const goldWeight = document.getElementById('goldWeight').value;

      fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sku, category: 'RINGS', goldWeight })
      }).then(() => {
        alert('Design saved successfully to Orven Jewels!');
        window.location.href = 'index.html';
      });
    }
  </script>
</body>
</html>
