<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - ORVÉN JEWELS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0708;
      --card-bg: #140d0f;
      --gold: #d4af37;
      --text-main: #f5f5f5;
      --text-muted: #a09a9c;
      --border: #241a1c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .auth-container { width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .brand-logo { font-family: 'Cinzel', serif; font-size: 24px; font-weight: 700; color: #fff; text-align: center; text-decoration: none; display: block; margin-bottom: 5px; letter-spacing: 2px; }
    .brand-logo span { color: var(--gold); font-size: 12px; display: block; font-weight: 400; }
    .auth-subtitle { text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 25px; letter-spacing: 1px; }

    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.3s; background: none; border: none; letter-spacing: 1px; }
    .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .form-group input { width: 100%; background: #1a1214; border: 1px solid var(--border); padding: 12px; color: #fff; font-size: 13px; border-radius: 4px; outline: none; transition: border-color 0.3s; }
    .form-group input:focus { border-color: var(--gold); }

    .btn-submit { width: 100%; background: var(--gold); color: #000; border: none; padding: 12px; font-weight: 600; font-size: 12px; letter-spacing: 1.5px; cursor: pointer; border-radius: 4px; margin-top: 10px; transition: opacity 0.3s; text-transform: uppercase; }
    .btn-submit:hover { opacity: 0.9; }

    .back-home { display: block; text-align: center; margin-top: 20px; font-size: 11px; color: var(--text-muted); text-decoration: none; letter-spacing: 1px; }
    .back-home:hover { color: var(--gold); }

    .otp-section { display: none; }
  </style>
</head>
<body>

  <div class="auth-container">
    <a href="index.html" class="brand-logo">ORVÉN <span>JEWELS</span></a>
    <p class="auth-subtitle" id="subtitleText">Secure OTP Verification</p>

    <div class="tabs" id="authTabs">
      <button class="tab active" onclick="switchTab('login')">LOGIN</button>
      <button class="tab" onclick="switchTab('signup')">SIGN UP</button>
    </div>

    <!-- Step 1: Mobile Input Form -->
    <form id="mobileForm" onsubmit="sendOTP(event)">
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" id="userMobile" required placeholder="Enter your 10-digit mobile number" maxlength="10">
      </div>
      <button type="submit" class="btn-submit">Send OTP</button>
    </form>

    <!-- Step 2: OTP Verification Form (Hidden Initially) -->
    <form id="otpForm" class="otp-section" onsubmit="verifyOTPAndRoute(event)">
      <div class="form-group">
        <label>Enter 4-Digit OTP</label>
        <input type="text" id="enteredOtp" required placeholder="Enter code (Mock: 1234)" maxlength="4">
      </div>
      <button type="submit" class="btn-submit">Verify & Proceed</button>
      <button type="button" class="btn-submit" style="background: transparent; border: 1px solid var(--gold); color: var(--gold); margin-top: 8px;" onclick="resendOTP()">Resend OTP</button>
    </form>

    <a href="index.html" class="back-home">← Back to Homepage</a>
  </div>

  <script>
    const allowedAdminNumbers = ["9999999999", "9876543210"];
    const allowedClientNumbers = ["8888888888", "7777777777"];

    let currentMobile = "";
    let generatedOtp = "1234"; // Default simulation OTP

    function switchTab(tabType) {
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
    }

    function sendOTP(event) {
      event.preventDefault();
      const mobileInput = document.getElementById('userMobile').value.trim();

      if(mobileInput.length < 10) {
        alert('Please enter a valid 10-digit mobile number.');
        return;
      }

      currentMobile = mobileInput;

      // Simulate sending OTP alert
      alert(`OTP sent successfully to +91 ${currentMobile}\n(For testing, use OTP: 1234)`);

      // Hide mobile form and show OTP input box
      document.getElementById('mobileForm').style.display = 'none';
      document.getElementById('authTabs').style.display = 'none';
      document.getElementById('otpForm').style.display = 'block';
      document.getElementById('subtitleText').innerText = `Verifying +91 ${currentMobile}`;
    }

    function resendOTP() {
      alert(`New OTP sent to +91 ${currentMobile}\n(For testing, use OTP: 1234)`);
    }

    function verifyOTPAndRoute(event) {
      event.preventDefault();
      const userOtp = document.getElementById('enteredOtp').value.trim();

      if (userOtp !== generatedOtp) {
        alert('Invalid OTP! Please enter correct code (1234).');
        return;
      }

      // Check if number is Admin, Client, or Unrecognized
      if (allowedAdminNumbers.includes(currentMobile)) {
        alert('OTP Verified! Admin Access Granted.');
        window.location.href = 'admin.html';
      } else if (allowedClientNumbers.includes(currentMobile)) {
        alert('OTP Verified! Loading Client Portal & Offers.');
        window.location.href = 'dashboard.html';
      } else {
        alert('OTP Verified, but this number is not registered for special portal access. Returning to Homepage.');
        window.location.href = 'index.html';
      }
    }
  </script>

</body>
</html>
